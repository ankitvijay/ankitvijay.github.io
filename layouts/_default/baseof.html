<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }} – {{ site.Params.description }}{{ else }}{{ if eq .Kind "term" }}{{ partial "term-name.html" . }}{{ else }}{{ .Title }}{{ end }} – {{ site.Title }}{{ end }}</title>
  {{- $desc := site.Params.description }}{{ with .Params.summary }}{{ $desc = . }}{{ end }}
  <meta name="description" content="{{ $desc }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:site_name" content="{{ site.Title }}">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ $desc }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  {{ with .Params.featured_image }}<meta property="og:image" content="{{ . | absURL }}">{{ end }}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:creator" content="@vijayankit">
  <link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ "feed.xml" | relURL }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
      <nav>
        <a href="{{ "/about/" | relURL }}">About</a>
        <a href="{{ site.Params.twitter }}">Twitter</a>
        <a href="{{ site.Params.linkedin }}">LinkedIn</a>
        <a href="{{ site.Params.github }}">GitHub</a>
        <a href="{{ "feed.xml" | relURL }}">RSS</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; {{ now.Year }} {{ site.Params.author }}</span>
      <span><a href="{{ "/disclaimer/" | relURL }}">Disclaimer</a> · <a href="{{ "/privacy-policy/" | relURL }}">Privacy</a></span>
    </div>
  </footer>
</body>
</html>
