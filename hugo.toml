baseURL = "https://ankitvijay.net/"
languageCode = "en-us"
title = "Hi, I'm Ankit!"
enableRobotsTXT = true
disableKinds = []

[params]
  description = "Welcome to my blog on .NET, cloud, and everything else"
  author = "Ankit Vijay"
  twitter = "https://twitter.com/vijayankit"
  linkedin = "https://www.linkedin.com/in/ankitvijay/"
  github = "https://github.com/ankitvijay"

# Same archive addresses as WordPress: /category/<name>/ and /tag/<name>/
[taxonomies]
  category = "category"
  tag = "tag"

# Same paging addresses as WordPress: /page/2/
[pagination]
  pagerSize = 10
  path = "page"

[markup.goldmark.renderer]
  unsafe = true   # imported posts contain some raw HTML (embeds)

[markup.highlight]
  noClasses = true
  style = "github-dark"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[outputFormats.RSS]
  baseName = "feed"

[services.rss]
  limit = 30
